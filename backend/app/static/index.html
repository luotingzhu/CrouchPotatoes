<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-i18n="app.title">FinBrief 电机市场情报 AI 助手</title>
<style>
  :root{
    --navy:#1F3A5F; --accent:#2E6DA4; --accent-soft:#E8F0F9;
    --bg:#F4F7FB; --card:#FFFFFF; --ink:#1C2430; --grey:#5A6472; --faint:#8A94A3;
    --line:#DCE4EE; --line-soft:#EDF2F8;
    --ok:#1F7A4D; --ok-bg:#E6F4EC;
    --warn:#8A5A00; --warn-bg:#FFF4DF;
    --err:#9B2C2C; --err-bg:#FDECEC;
    --shadow:0 1px 2px rgba(31,58,95,.06), 0 6px 20px rgba(31,58,95,.06);
  }
  *{box-sizing:border-box}
  [hidden]{display:none !important}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--ink); min-height:100vh; font-size:14.5px;
    font-family:"Segoe UI","Microsoft YaHei",system-ui,-apple-system,Helvetica,Arial,sans-serif;
    line-height:1.55; -webkit-font-smoothing:antialiased;
  }
  button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
  input,select,textarea{font:inherit;color:inherit}
  a{color:var(--accent)}
  h1,h2,h3,h4{margin:0}

  /* ---------- 登录 ---------- */
  #loginScreen{display:grid;place-items:center;min-height:100vh;padding:32px 20px}
  .authcard{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);
    width:100%;max-width:460px;padding:32px}
  .brand{display:flex;align-items:center;gap:8px;margin-bottom:4px}
  .brand-logo{width:26px;height:26px;border-radius:7px;object-fit:contain;background:#fff;flex:none}
  .brand .mark{font-weight:700;font-size:21px;color:var(--navy);letter-spacing:-.3px}
  .brand .tag{font-size:11.5px;color:var(--faint)}
  .sub{color:var(--grey);font-size:13px;margin:6px 0 22px}
  .tabs{display:flex;gap:6px;background:var(--bg);border-radius:10px;padding:4px;margin-bottom:20px}
  .tabs button{flex:1;padding:9px;border-radius:7px;font-size:14px;color:var(--grey);transition:.15s}
  .tabs button.on{background:var(--card);color:var(--navy);font-weight:600;box-shadow:0 1px 3px rgba(31,58,95,.1)}
  .field{margin-bottom:14px}
  .field label{display:block;font-size:12.5px;color:var(--grey);margin-bottom:6px;font-weight:500}
  .field input,.field select,.field textarea{width:100%;padding:10px 12px;border:1px solid var(--line);
    border-radius:9px;background:#FCFDFF;outline:none;transition:.15s}
  .field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent);background:#fff;
    box-shadow:0 0 0 3px rgba(46,109,164,.1)}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:6px 13px;font-size:13px;
    color:var(--grey);transition:.15s}
  .chip:hover{border-color:var(--accent);color:var(--accent)}
  .chip.on{background:var(--accent-soft);border-color:var(--accent);color:var(--navy);font-weight:600}
  .btn{background:var(--navy);color:#fff;border-radius:9px;padding:10px 18px;font-weight:600;transition:.15s}
  .btn:hover{background:#16304F}
  .btn:disabled{opacity:.45;cursor:not-allowed}
  .btn.sm{padding:7px 13px;font-size:13px;border-radius:8px}
  .btn.ghost{background:var(--card);color:var(--grey);border:1px solid var(--line);font-weight:500}
  .btn.ghost:hover{border-color:#C3D2E4;color:var(--navy);background:var(--card)}
  .err{background:var(--err-bg);color:var(--err);border-radius:8px;padding:9px 12px;font-size:13px;margin-bottom:14px}
  .hint{font-size:12px;color:var(--faint);margin-top:12px}

  /* ---------- 应用外壳 ---------- */
  .topbar{background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
  .topbar .inner{display:flex;align-items:center;gap:16px;height:58px;padding:0 20px}
  .spacer{flex:1}
  .userchip{display:flex;align-items:center;gap:9px;background:var(--accent-soft);border-radius:999px;
    padding:5px 12px 5px 6px;font-size:13px;color:var(--navy)}
  .avatar{width:26px;height:26px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;
    font-size:12px;font-weight:600}
  .layout{display:grid;grid-template-columns:210px 1fr;gap:0;min-height:calc(100vh - 58px - 40px)}
  .sidenav{background:var(--card);border-right:1px solid var(--line);padding:16px 12px}
  .sidenav button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:10px 12px;
    border-radius:9px;color:var(--grey);font-size:14px;margin-bottom:4px;transition:.15s}
  .sidenav button:hover{background:var(--bg);color:var(--navy)}
  .sidenav button.on{background:var(--accent-soft);color:var(--navy);font-weight:600}
  .sidenav .dot{width:7px;height:7px;border-radius:50%;background:currentColor;opacity:.5}
  main{padding:24px 26px 40px;overflow:auto}
  .page-head{display:flex;align-items:center;gap:12px;margin-bottom:18px}
  .page-head h2{font-size:19px;color:var(--navy);letter-spacing:-.3px}
  .page-head p{color:var(--grey);font-size:13px;margin:4px 0 0}

  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);
    padding:18px 20px;margin-bottom:16px}
  .card h3{font-size:14px;color:var(--navy);margin-bottom:12px;display:flex;align-items:center;gap:8px}
  .grid{display:grid;gap:14px}
  .grid.c3{grid-template-columns:repeat(3,1fr)}
  .grid.c4{grid-template-columns:repeat(4,1fr)}
  .grid.c2{grid-template-columns:1fr 1fr}

  .kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
  .kpi .n{font-size:24px;font-weight:700;color:var(--navy);letter-spacing:-.5px}
  .kpi .l{font-size:12px;color:var(--faint);margin-top:2px}
  .badge{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:3px 9px;border-radius:999px}
  .badge.ok{background:var(--ok-bg);color:var(--ok)}
  .badge.no{background:var(--err-bg);color:var(--err)}
  .badge.info{background:var(--accent-soft);color:var(--navy)}
  .warnbox{background:var(--warn-bg);color:var(--warn);border:1px solid #EFD9AE;border-radius:9px;
    padding:9px 12px;font-size:12.5px;line-height:1.6;margin:8px 0 12px}

  /* ---------- 报告目录与章节 ---------- */
  .toc{background:#F8FBFF;border:1px solid var(--line);border-radius:10px;padding:12px 16px;margin:10px 0 18px}
  .toc-title{font-size:12px;letter-spacing:1.2px;text-transform:uppercase;color:var(--faint);
    font-weight:600;margin-bottom:6px}
  .toc ol{margin:0;padding-left:20px}
  .toc li{margin:4px 0}
  .toc a{color:var(--accent);text-decoration:none;font-size:13.5px}
  .toc a:hover{text-decoration:underline}
  .chapter{margin-bottom:18px;scroll-margin-top:70px}
  .chapter-title{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:700;
    color:var(--navy);padding-bottom:8px;border-bottom:1px solid var(--line);margin-bottom:10px}
  .chapter-no{background:var(--accent-soft);color:var(--navy);font-size:11px;font-weight:700;
    border-radius:6px;padding:2px 7px;letter-spacing:.5px}

  table{width:100%;border-collapse:collapse;font-size:13.5px}
  th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line-soft)}
  th{color:var(--faint);font-weight:600;font-size:12px;letter-spacing:.4px;text-transform:uppercase}
  tr:last-child td{border-bottom:none}
  .mono{font-family:"Cascadia Code",Consolas,monospace;font-size:12.5px}

  .list{display:flex;flex-direction:column;gap:10px}
  .list .item{border:1px solid var(--line);border-radius:10px;padding:12px 14px;background:#FCFDFF}
  .list .item .t{font-weight:600;color:var(--ink);margin-bottom:4px;overflow-wrap:anywhere}
  .list .item .m{font-size:12.5px;color:var(--faint);overflow-wrap:anywhere;word-break:break-word}
  .sec-title{font-size:12px;letter-spacing:1.2px;text-transform:uppercase;color:var(--faint);
    font-weight:600;margin:18px 0 8px}
  .sec-body{white-space:pre-wrap;line-height:1.75;font-size:14px}
  .src-list{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
  .src-list a{font-size:12px;background:var(--accent-soft);color:var(--navy);border-radius:999px;
    padding:4px 10px;text-decoration:none;max-width:100%;overflow-wrap:anywhere}

  .chatlog{display:flex;flex-direction:column;gap:12px;max-height:460px;overflow:auto;padding:6px 2px}
  .msg{max-width:78%;padding:10px 14px;border-radius:12px;font-size:14px;white-space:pre-wrap;line-height:1.65}
  .msg.user{align-self:flex-end;background:var(--navy);color:#fff;border-bottom-right-radius:4px}
  .msg.ai{align-self:flex-start;background:var(--accent-soft);color:var(--ink);border-bottom-left-radius:4px}
  .msg.sys{align-self:center;background:var(--bg);color:var(--faint);font-size:12px;padding:5px 10px}
  .chatinput{display:flex;gap:10px;margin-top:12px}
  .chatinput input{flex:1;padding:11px 14px;border:1px solid var(--line);border-radius:10px;outline:none}

  #livebar{position:fixed;left:0;right:0;bottom:0;height:40px;background:#12283F;color:#C9DAEE;
    display:flex;align-items:center;gap:12px;padding:0 18px;font-size:12.5px;z-index:30}
  #livebar .lbl{color:#7FA6CD;flex:none}
  #livebar .tick{flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
  #livebar .st{flex:none;padding:2px 8px;border-radius:999px;background:#1F3A5F;color:#9FC2E4}
  .evlog{max-height:340px;overflow:auto;font-family:"Cascadia Code",Consolas,monospace;font-size:12.5px}
  .evlog .row{display:flex;gap:10px;padding:5px 0;border-bottom:1px dashed var(--line-soft)}
  .evlog .ts{color:var(--faint);flex:none}
  .evlog .stg{flex:none;width:66px;font-weight:600}
  .evlog .stg.crawl{color:#2E6DA4}.evlog .stg.ingest{color:#1F7A4D}
  .evlog .stg.embed{color:#7A4E00}.evlog .stg.report{color:#7B2E6D}
  .evlog .stg.chat{color:#1F3A5F}.evlog .stg.system{color:#8A94A3}
  .toast{position:fixed;right:20px;bottom:56px;display:flex;flex-direction:column;gap:8px;z-index:40}
  .toast div{background:var(--navy);color:#fff;padding:10px 14px;border-radius:10px;font-size:13px;
    box-shadow:var(--shadow);animation:in .2s ease}
  @keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1}}

  /* ---------- 中英切换 ---------- */
  .langswitch{display:inline-flex;align-items:center;background:var(--bg);border:1px solid var(--line);
    border-radius:999px;padding:3px;gap:2px;flex:none}
  .langswitch button{padding:4px 10px;border-radius:999px;font-size:12px;font-weight:600;color:var(--grey);
    line-height:1.2;transition:.15s}
  .langswitch button:hover{color:var(--navy)}
  .langswitch button.on{background:var(--card);color:var(--navy);box-shadow:0 1px 3px rgba(31,58,95,.14)}
  #langSwitchLogin{position:fixed;top:18px;right:18px;z-index:60}

  /* ---------- 管理员模式 ---------- */
  .adminrow{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .switch{position:relative;display:inline-block;width:44px;height:24px;flex:none}
  .switch input{opacity:0;width:0;height:0}
  .switch .slider{position:absolute;inset:0;background:#C9D6E5;border-radius:999px;transition:.2s;cursor:pointer}
  .switch .slider:before{content:"";position:absolute;width:18px;height:18px;left:3px;top:3px;
    background:#fff;border-radius:50%;transition:.2s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
  .switch input:checked + .slider{background:var(--accent)}
  .switch input:checked + .slider:before{transform:translateX(20px)}
  .adminpwd{display:flex;gap:10px}
  .adminpwd input{flex:1;padding:9px 12px;border:1px solid var(--line);border-radius:9px;outline:none;background:#FCFDFF}
  .adminpwd input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(46,109,164,.1)}

  /* ---------- 移动端 / 窄屏适配 ---------- */
  @media (max-width: 860px){
    /* 侧边栏改成顶部横向导航条，避免挤占正文宽度 */
    .layout{grid-template-columns:1fr;align-content:start;min-height:calc(100vh - 54px - 40px)}
    .sidenav{display:flex;align-items:center;gap:6px;overflow-x:auto;padding:8px 10px;
      border-right:none;border-bottom:1px solid var(--line);-webkit-overflow-scrolling:touch}
    .sidenav button{width:auto;flex:none;margin:0;white-space:nowrap;padding:8px 12px;font-size:13px}
    .sidenav .dot{display:none}

    .topbar .inner{height:54px;gap:10px;padding:0 12px}
    .brand .tag{display:none}
    #brokerChip,#vecChip{display:none}
    #whoami{display:none}

    main{padding:16px 14px 64px}
    .card{padding:14px 14px;border-radius:12px}
    .page-head{flex-wrap:wrap;gap:10px;margin-bottom:14px}
    .page-head h2{font-size:17px}
    .grid.c2,.grid.c3,.grid.c4{grid-template-columns:1fr}

    /* 宽表格在窄屏内横向滚动，不再撑破页面 */
    main table{display:block;overflow-x:auto;white-space:nowrap;-webkit-overflow-scrolling:touch}

    .msg{max-width:88%}
    .chatlog{max-height:56vh}
    /* 会话列表限高：避免把对话框挤到屏幕外 */
    #sessList{max-height:34vh;overflow:auto;padding-right:4px}
    .chatinput input{min-width:0}
    .evlog{font-size:11.5px}
    .evlog .stg{width:50px}
    .evlog .row{gap:6px}

    #loginScreen{display:block;padding:64px 14px 32px}
    .authcard{padding:24px 18px;border-radius:14px;max-width:100%;margin:0 auto}
    html,body{overflow-x:hidden}
    .kpi .n{font-size:20px}
    .toc{padding:10px 12px}
    #toast{right:12px;left:12px}
  }
  @media (max-width: 420px){
    .langswitch button{padding:4px 8px}
    .userchip{padding:4px 8px 4px 4px}
    .btn.sm{padding:6px 10px;font-size:12.5px}
    .msg{max-width:92%}
    #langSwitchLogin{top:10px;right:10px}
  }
</style>
</head>
<body>

<!-- ===================== 登录 / 注册 ===================== -->
<div id="loginScreen">
  <div class="langswitch" id="langSwitchLogin">
    <button type="button" data-lang="zh">CN</button>
    <button type="button" data-lang="en">EN</button>
  </div>
  <div class="authcard">
    <div class="brand"><img class="brand-logo" src="/static/logo.png" alt="FinBrief"><span class="mark">FinBrief</span><span class="tag" data-i18n="brand.tag"></span></div>
    <p class="sub" data-i18n="auth.subtitle"></p>

    <div class="tabs">
      <button id="tabLogin" class="on" data-i18n="auth.login"></button>
      <button id="tabReg" data-i18n="auth.register"></button>
    </div>

    <div id="loginErr" class="err" hidden></div>

    <form id="loginForm">
      <div class="field"><label data-i18n="field.username"></label><input id="li_user" autocomplete="username"></div>
      <div class="field"><label data-i18n="field.password"></label><input id="li_pass" type="password" autocomplete="current-password"></div>
      <button class="btn" style="width:100%" type="submit" data-i18n="btn.login"></button>
      <p class="hint" data-i18n="auth.hint"></p>
    </form>

    <form id="regForm" hidden>
      <div class="field"><label data-i18n="field.username"></label><input id="rg_user" autocomplete="username" maxlength="64" data-i18n-ph="ph.username"></div>
      <div class="field"><label data-i18n="field.email"></label><input id="rg_email" autocomplete="email" inputmode="email" autocapitalize="off" spellcheck="false" maxlength="254" placeholder="name@example.com"></div>
      <div class="field"><label data-i18n="field.passwordMin"></label><input id="rg_pass" type="password" autocomplete="new-password" maxlength="128"></div>
      <div class="field"><label data-i18n="field.role"></label><div class="chips" id="rg_roles"></div></div>
      <div class="field"><label data-i18n="field.modules"></label><div class="chips" id="rg_modules"></div></div>
      <button class="btn" style="width:100%" type="submit" id="regSubmit" data-i18n="btn.register"></button>
    </form>
  </div>
</div>

<!-- ===================== 主应用 ===================== -->
<div id="appScreen" hidden>
  <header class="topbar">
    <div class="inner">
      <div class="brand"><img class="brand-logo" src="/static/logo.png" alt="FinBrief" style="width:24px;height:24px"><span class="mark" style="font-size:17px">FinBrief</span><span class="tag" data-i18n="brand.tag.short"></span></div>
      <div class="spacer"></div>
      <div class="langswitch" id="langSwitchApp">
        <button type="button" data-lang="zh">CN</button>
        <button type="button" data-lang="en">EN</button>
      </div>
      <span id="brokerChip" class="badge info"></span>
      <span id="vecChip" class="badge info"></span>
      <div class="userchip"><span class="avatar" id="avatar">D</span><span id="whoami">-</span></div>
      <button class="btn ghost sm" id="btnLogout" data-i18n="btn.logout"></button>
    </div>
  </header>

  <div class="layout">
    <nav class="sidenav">
      <button data-view="sources" class="on"><span class="dot"></span><span data-i18n="nav.sources"></span></button>
      <button data-view="reports"><span class="dot"></span><span data-i18n="nav.reports"></span></button>
      <button data-view="chat"><span class="dot"></span><span data-i18n="nav.chat"></span></button>
      <button data-view="config"><span class="dot"></span><span data-i18n="nav.config"></span></button>
      <button data-view="system" id="navSystem" hidden><span class="dot"></span><span data-i18n="nav.system"></span></button>
    </nav>
    <main id="view"></main>
  </div>

  <div id="livebar">
    <span class="lbl" data-i18n="live.label"></span>
    <span class="st" id="liveStage">idle</span>
    <span class="tick" id="liveTick" data-i18n="live.waiting"></span>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ============================================================
 * 全局状态与基础工具
 * ============================================================ */
const S = { token: localStorage.getItem('domel_token') || '', user: null, meta: null,
            view: 'sources', report: null, session: null, events: [],
            lang: localStorage.getItem('domel_lang') || 'zh',
            admin: false,
            runtimeBroker: '', runtimeVector: '' };

const $  = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmtTime = (iso) => {
  try { return new Date(iso).toLocaleString(S.lang === 'en' ? 'en-US' : 'zh-CN', {hour12:false}); }
  catch { return iso; }
};

/* ============================================================
 * 国际化（i18n）：中文 / 英文
 * 说明：仅翻译界面文案；新闻正文、AI 报告、对话内容属于数据，保持原样。
 * ============================================================ */
const I18N = {
  zh: {
    'app.title': 'FinBrief 电机市场情报 AI 助手',
    'brand.tag': '电机市场情报 AI 助手',
    'brand.tag.short': '市场情报 AI 助手',
    'auth.subtitle': '多源数据聚合 · AI 定制报告 · 基于知识库的多轮问答',
    'auth.login': '登录',
    'auth.register': '注册',
    'auth.hint': '首次使用可切换到「注册」；演示账号 demo / demo1234（需先运行种子脚本）。',
    'field.username': '用户名', 'field.password': '密码', 'field.email': '邮箱',
    'field.passwordMin': '密码（≥6 位）', 'field.role': '我的角色', 'field.modules': '关注的情报模块',
    'field.name': '名称', 'field.url': 'URL', 'field.type': '类型',
    'field.role_names': '角色', 'field.module_codes': '模块',
    'ph.username': '2-64 个字符', 'ph.sourceName': '例：某财经站点',
    'ph.sourceUrl': 'http://... 或 https://...',
    'ph.question': '例：本季度电机原材料价格有哪些变化？',
    'btn.login': '登录', 'btn.register': '注册并进入', 'btn.registering': '注册中…',
    'btn.logout': '退出', 'btn.add': '添加', 'btn.trigger': '抓取', 'btn.triggering': '抓取中…',
    'btn.triggerAll': '一键抓取全部', 'btn.generate': '生成新报告',
    'btn.generating': '生成中…（调用大模型，约 10-30s）',
    'btn.newSession': '新建会话', 'btn.send': '发送', 'btn.save': '保存配置',
    'btn.translate': '翻译为中文', 'btn.translating': '翻译中…',
    'nav.sources': '数据源与入库', 'nav.reports': 'AI 情报报告', 'nav.chat': '知识库对话',
    'nav.config': '个性化配置', 'nav.system': '后端同步状态',
    'topbar.broker': '管道：', 'topbar.vector': '向量库：',

function sourceLabel(s){
  if (S.lang !== 'en') return s.source_name;
  return SOURCE_NAME_EN[s.source_name] || s.source_name;
}

function t(key, vars){
  const dict = I18N[S.lang] || I18N.zh;
  let str = dict[key];
  if (str === undefined) str = I18N.zh[key] !== undefined ? I18N.zh[key] : key;
  if (vars) {
    for (const k in vars) str = str.replace(new RegExp('\\{' + k + '\\}', 'g'), vars[k]);
  }
  return str;
}

function roleLabel(name){ return (ROLE_LABEL[name] || {})[S.lang] || name; }
function moduleLabel(item){ return (MODULE_LABEL[item.module_code] || {})[S.lang] || item.module_name; }
function moduleLabelByCode(code){ return (MODULE_LABEL[code] || {})[S.lang] || code; }
function fieldLabel(field){
  const key = 'field.' + field;
  const label = t(key);
  return label === key ? field : label;
}
function sectionLabel(type){
  const key = 'section.' + type;
  const label = t(key);
  return label === key ? type : label;
}
function statusLabel(status){
  const key = 'status.' + status;
  const label = t(key);
  return label === key ? status : label;
}

/* ---------- 错误信息格式化 ----------
 * FastAPI 的校验失败(422)返回 detail 为对象数组，直接拼进 Error 会显示 [object Object]。
 * 这里统一把 string / array / object 三种形态转成可读中文。
 */
// 与后端保持一致的邮箱规则（前端预校验，后端仍会再校验一次）
const EMAIL_RE = /^(?=.{6,254}$)(?=.{1,64}@)[A-Za-z0-9!#$%&'*+\/=?^_`{|}~.-]+@(?:[A-Za-z0-9](?:[A-Za-z0-9-]{0,61}[A-Za-z0-9])?\.)+[A-Za-z]{2,63}$/;
function isValidEmail(v){
  v = String(v || '').trim();
  if (!EMAIL_RE.test(v)) return false;
  const local = v.split('@')[0];
  return !(local.startsWith('.') || local.endsWith('.') || local.includes('..'));
}

function pydanticMsg(d){
  const type = d.type || '', ctx = d.ctx || {};
  switch (type){
    case 'string_too_short': return t('val.tooShort', {n: ctx.min_length});
    case 'string_too_long':  return t('val.tooLong', {n: ctx.max_length});
    case 'missing':          return t('val.required');
    case 'string_type':      return t('val.text');
    case 'value_error': {
      const raw = String(d.msg || '').replace(/^Value error,\s*/, '');
      return S.lang === 'en' ? (BACKEND_MSG_EN[raw] || raw) : raw;
    }
    default:                 return d.msg || t('val.invalid');
  }
}

function formatApiError(data, status){
  const detail = data && data.detail;
  // 1) 后端主动抛的 HTTPException：detail 是字符串
  if (typeof detail === 'string' && detail) {
    return S.lang === 'en' ? (BACKEND_MSG_EN[detail] || detail) : detail;
  }
  // 2) 校验错误：detail 是 [{loc, msg, type}, ...]
  if (Array.isArray(detail)) {
    const parts = detail.map(d => {
      const loc = Array.isArray(d.loc) ? d.loc.filter(x => x !== 'body') : [];
      const field = loc.length ? loc[loc.length - 1] : '';
      const label = field ? fieldLabel(field) : '';
      const msg = pydanticMsg(d);
      // 若后端消息已自带字段名（如「邮箱格式不正确」），不再重复加前缀
      if (!label || msg.startsWith(label)) return msg;
      return `${label}：${msg}`;
    });
    if (parts.length) return parts.join('；');
  }
  // 3) detail 是对象
  if (detail && typeof detail === 'object') {
    return detail.message || detail.msg || JSON.stringify(detail);
  }
  // 4) 纯文本响应 / 兜底
  if (typeof data === 'string' && data.trim()) return data;
  if (data && typeof data.message === 'string') return data.message;
  return t('err.requestFailed', {n: status});
}

function toast(msg){
  const d = document.createElement('div'); d.textContent = msg; $('toast').appendChild(d);
  setTimeout(()=>d.remove(), 2600);
}

async function api(path, opts = {}){
  const headers = Object.assign({'Content-Type':'application/json'}, opts.headers || {});
  if (S.token) headers['Authorization'] = 'Bearer ' + S.token;
  const res = await fetch(path, Object.assign({}, opts, {headers}));

  // 仅在「已登录状态下」收到 401 才视为会话失效；
  // 登录接口密码错误也返回 401，此时应展示后端给的「用户名或密码错误」。
  if (res.status === 401 && S.token) { logout(false); throw new Error(t('err.sessionExpired')); }

  const text = await res.text();
  let data = null; try { data = text ? JSON.parse(text) : null; } catch { data = text; }
  if (!res.ok) {
    const err = new Error(formatApiError(data, res.status));
    err.status = res.status;      // 便于调用方区分 401/403
    throw err;
  }
  return data;
}

function renderChips(container, items, set, key, labelFn){
  container.innerHTML = '';
  items.forEach(it => {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'chip' + (set.has(it[key]) ? ' on' : '');
    b.textContent = labelFn(it);
    b.onclick = () => { const v = it[key]; set.has(v) ? set.delete(v) : set.add(v); b.classList.toggle('on'); };
    container.appendChild(b);
  });
}

async function loadMeta(){
  if (S.meta) return S.meta;
  S.meta = await api('/api/auth/meta');
  renderChips($('rg_roles'), S.meta.roles, pick.roles, 'role_name', it => roleLabel(it.role_name));
  renderChips($('rg_modules'), S.meta.modules, pick.modules, 'module_code', it => moduleLabel(it));
  return S.meta;
}

$('loginForm').onsubmit = async (e) => {
  e.preventDefault(); $('loginErr').hidden = true;
  try {
    const r = await api('/api/auth/login', {method:'POST', body: JSON.stringify({
      username: $('li_user').value.trim(), password: $('li_pass').value })});
    enterApp(r.token, r.user);
  } catch (err) { $('loginErr').textContent = err.message; $('loginErr').hidden = false; }
};

$('regForm').onsubmit = async (e) => {
  e.preventDefault();
  const errBox = $('loginErr');
  errBox.hidden = true;

  const username = $('rg_user').value.trim();
  const email = $('rg_email').value.trim();
  const password = $('rg_pass').value;

  // 客户端预校验：给出即时、明确的中文提示，避免明显不合法的请求打到后端
  let msg = '';
  if (username.length < 2) msg = t('val.usernameShort');
  else if (!isValidEmail(email)) msg = t('val.emailInvalid');
  else if (password.length < 6) msg = t('val.passwordShort');
  if (msg) { errBox.textContent = msg; errBox.hidden = false; return; }

  // 防重复提交：连点会导致第二个请求 409（用户名/邮箱已存在）
  const btn = $('regSubmit');
  btn.disabled = true; btn.textContent = t('btn.registering');
  try {
    const r = await api('/api/auth/register', {method:'POST', body: JSON.stringify({
      username, email, password,
      role_names: [...pick.roles], module_codes: [...pick.modules] })});
    enterApp(r.token, r.user);
  } catch (err) {
    errBox.textContent = err.message || t('val.registerFailed');
    errBox.hidden = false;
  } finally {
    btn.disabled = false; btn.textContent = t('btn.register');
  }
};

function enterApp(token, user){
  S.token = token; S.user = user; localStorage.setItem('domel_token', token);
  $('loginScreen').hidden = true; $('appScreen').hidden = false;
  updateUserChip();
  refreshAdmin();          // 恢复管理员解锁状态（标记存于 Redis，带过期时间）
  switchView('sources');
}

function logout(callApi = true){
  if (callApi && S.token) api('/api/auth/logout', {method:'POST'}).catch(()=>{});
  S.token = ''; S.user = null; S.admin = false; localStorage.removeItem('domel_token');
  S.view = 'sources';
  applyAdminUI();
  $('appScreen').hidden = true; $('loginScreen').hidden = false;
}

$('btnLogout').onclick = () => logout(true);

async function loadReports(){
  try {

    $('rptList').querySelectorAll('[data-rpt]').forEach(el => el.onclick = async () => {

    });

function staleText(r){
  const sep = S.lang === 'en' ? ', ' : '、';
  const names = (codes) => (codes || []).map(moduleLabelByCode).join(sep);
  let msg = t('reports.stale', {
    hours: r.lookback_hours || 72,
    time: fmtTime(r.latest_source_time)
  });
  const stale = names(r.stale_module_codes);
  if (stale) msg += ' ' + t('reports.staleModules', {modules: stale});
  const suggest = names(r.suggest_module_codes);
  if (suggest) msg += ' ' + t('reports.staleSuggest', {modules: suggest});
  return msg;
}

function renderDetail(r){
  S.report = r;    // 记住当前报告，切换语言后可原样重绘

  // 正文语言与当前界面语言不一致时，提供一键翻译
  const joined = r.sections.map(s => s.content).join(' ');
  const cjk = (joined.match(/[\u4e00-\u9fff]/g) || []).length;
  const looksChinese = cjk > joined.length * 0.08;
  const needTranslate = joined.trim().length > 0 &&
    ((S.lang === 'en' && looksChinese) || (S.lang === 'zh' && !looksChinese));

  // 目录 + 分章节：先列目录，再按章节渲染（去掉正文自带的首个一级标题，避免重复）
  const stripHeading = (txt) => String(txt || '').replace(/^\s*#{1,3}\s+[^\n]*\n+/, '');
  const tocHtml = `
    <div class="toc">
      <div class="toc-title">${t('reports.toc')}</div>
      <ol>${r.sections.map((s, i) =>
        `<li><a href="#sec-${i}">${sectionLabel(s.section_type)}</a></li>`).join('')}</ol>
    </div>`;
  const chaptersHtml = r.sections.map((s, i) => `
    <div class="chapter" id="sec-${i}">
      <div class="chapter-title"><span class="chapter-no">${String(i + 1).padStart(2, '0')}</span>${sectionLabel(s.section_type)}</div>
      <div class="sec-body">${esc(stripHeading(s.content))}</div>
    </div>`).join('');

  $('rptDetail').innerHTML = `
    <div style="font-weight:700;color:var(--navy);font-size:15px">${esc(r.title)}</div>
    <div class="m" style="color:var(--faint);font-size:12.5px;margin:4px 0 12px">${fmtTime(r.generated_time)} · ${esc(statusLabel(r.status))}</div>
    ${r.data_stale ? `<div class="warnbox">${staleText(r)}</div>` : ''}
    ${needTranslate ? `<button class="btn ghost sm" id="btnTranslate" style="margin-bottom:14px">${t('btn.translate')}</button>` : ''}
    ${tocHtml}
    ${chaptersHtml}
    <div class="sec-title">${t('reports.traced', {n: r.sources.length})}</div>
    <div class="src-list">${r.sources.map(s => `<a href="${esc(s.url||'#')}" target="_blank">${esc(s.title || s.data_id)}</a>`).join('') || `<span style="color:var(--faint)">${t('reports.none')}</span>`}</div>`;

  if (needTranslate) {
    const btn = $('btnTranslate');
    btn.onclick = async () => {
      btn.disabled = true; btn.textContent = t('btn.translating');
      try {
        const translated = await api(
          `/api/reports/${r.report_id}/translate?lang=${S.lang}`, {method:'POST'});
        toast(t('toast.translated'));
        renderDetail(translated);
        loadReports();
      } catch (e) {
        toast(e.message);
        btn.disabled = false; btn.textContent = t('btn.translate');
      }
    };
  }
}

  $('btnNewSess').onclick = async () => {

async function loadSessions(){
  try {
    const list = await api('/api/chat/sessions');
    $('sessList').innerHTML = list.length ? '<div class="list">' + list.map(s => `
      <div class="item" data-sess="${s.session_id}" style="cursor:pointer">
        <div class="t">${esc(s.title || t('chat.untitled'))}</div>
        <div class="m">${fmtTime(s.last_active_at)}</div></div>`).join('') + '</div>'
      : `<p style="color:var(--faint)">${t('chat.empty')}</p>`;
    $('sessList').querySelectorAll('[data-sess]').forEach(el => el.onclick = () => openSession(el.dataset.sess));
  } catch (e) { $('sessList').innerHTML = '<p style="color:var(--err)">' + esc(e.message) + '</p>'; }
}

async function openSession(id){
  S.session = id;
  $('q').disabled = false; $('btnAsk').disabled = false;
  const log = $('chatlog'); log.innerHTML = '';
  try {
    const msgs = await api(`/api/chat/sessions/${id}/messages`);
    if (!msgs.length) log.innerHTML = `<div class="msg sys">${t('chat.ready')}</div>`;
    msgs.forEach(m => addMsg(m.sender_type === 'user' ? 'user' : 'ai', m.content));
  } catch (e) { toast(e.message); }
  // 窄屏下对话框在会话列表下方，打开会话后自动滚过去，避免「点了没反应」的错觉
  if (window.innerWidth <= 860) {
    const card = log.closest('.card');
    if (card) card.scrollIntoView({block: 'start', behavior: 'smooth'});
  }
}

function addMsg(role, text){
  const log = $('chatlog');
  const d = document.createElement('div');
  d.className = 'msg ' + role; d.textContent = text;
  log.appendChild(d); log.scrollTop = log.scrollHeight;
  return d;
}

async function askQuestion(){
  const q = $('q').value.trim(); if (!q || !S.session) return;
  $('q').value = ''; addMsg('user', q);
  const pending = addMsg('ai', t('chat.thinking'));
  $('btnAsk').disabled = true;
  try {
    const r = await api('/api/chat/ask', {method:'POST', body: JSON.stringify({session_id: S.session, question: q, lang: S.lang})});
    pending.textContent = r.answer + (r.cached ? '\n\n' + t('chat.cachedNote') : '');
  } catch (e) { pending.textContent = t('chat.error') + e.message; }
  finally { $('btnAsk').disabled = false; }
}

async function viewConfig(){
  await loadMeta();

  const v = $('view');
  v.innerHTML = `

    <div class="card">
      <h3>${t('config.myRoles')}</h3><div class="chips" id="cfgRoles"></div>

    </div>

    <div class="card">
      <h3>${t('config.adminTitle')}</h3>
      <div class="adminrow">
        <label class="switch"><input type="checkbox" id="adminToggle" ${S.admin ? 'checked' : ''}><span class="slider"></span></label>
        <div>
          <div style="font-weight:600;color:var(--navy)">${S.admin ? t('config.adminOn') : t('config.adminOff')}</div>
          <div style="font-size:12.5px;color:var(--faint)">${t('config.adminHint')}</div>
        </div>
        <div class="spacer"></div>
        <button class="btn ghost sm" id="adminGo" ${S.admin ? '' : 'hidden'}>${t('btn.openSystem')}</button>
      </div>
      <div id="adminPwdBox" hidden style="margin-top:12px">
        <div class="adminpwd">
          <input id="adminPwd" type="password" maxlength="128" autocomplete="off" placeholder="${t('config.adminPwdPh')}">
          <button class="btn sm" id="adminUnlock">${t('btn.unlock')}</button>
        </div>
      </div>
      <div id="adminErr" class="err" hidden style="margin-top:10px"></div>
    </div>`;

  const build = (container, items, set, key, labelFn) => {
    container.innerHTML = '';
    items.forEach(it => {
      const b = document.createElement('button');
      b.className = 'chip' + (set.has(it[key]) ? ' on' : ''); b.textContent = labelFn(it);
      b.onclick = () => { set.has(it[key]) ? set.delete(it[key]) : set.add(it[key]); b.classList.toggle('on'); };
      container.appendChild(b);
    });
  };
  build($('cfgRoles'), S.meta.roles, roleSet, 'role_name', it => roleLabel(it.role_name));
  build($('cfgModules'), S.meta.modules, modSet, 'module_code', it => moduleLabel(it));

  $('btnSavePrefs').onclick = async () => {
    try {
      const u = await api('/api/prefs', {method:'PUT', body: JSON.stringify({
        role_names:[...roleSet], module_codes:[...modSet] })});
      S.user = u; updateUserChip();
      toast(t('toast.prefsSaved'));
    } catch (e) { toast(e.message); }
  };

  // ---------- 管理员模式 ----------
  const adminToggle = $('adminToggle'), adminPwdBox = $('adminPwdBox'), adminErr = $('adminErr');
  const showAdminErr = (msg) => { adminErr.textContent = msg; adminErr.hidden = false; };

  adminToggle.onchange = async () => {
    adminErr.hidden = true;
    if (adminToggle.checked) {
      if (S.admin) return;
      // 仅显示密码框，真正解锁要等服务端校验通过
      adminPwdBox.hidden = false;
      setTimeout(() => { const el = $('adminPwd'); if (el) el.focus(); }, 0);
    } else {
      adminPwdBox.hidden = true;
      if (S.admin) {
        try { await api('/api/system/admin/lock', {method:'POST'}); } catch {}
        S.admin = false;
        applyAdminUI();
        toast(t('toast.adminOff'));
        switchView('config');
      }
    }
  };

  const doUnlock = async () => {
    const el = $('adminPwd');
    const pwd = (el && el.value) || '';
    adminErr.hidden = true;
    if (!pwd) { showAdminErr(t('config.adminNeedPwd')); return; }
    try {
      await api('/api/system/admin/unlock', {method:'POST', body: JSON.stringify({password: pwd})});
      S.admin = true;
      applyAdminUI();
      toast(t('toast.adminOn'));
      switchView('config');       // 重绘为“已开启”，并显示入口按钮
    } catch (e) {
      showAdminErr(e.message);
      if (el) el.select();
    }
  };

  $('adminUnlock').onclick = doUnlock;
  $('adminPwd').addEventListener('keydown', e => { if (e.key === 'Enter') doUnlock(); });
  $('adminGo').onclick = () => switchView('system');
}

    <div class="grid c4" id="sysKpi"></div>
    <div class="grid c2" style="align-items:start">
      <div class="card"><h3>${t('system.tableStats')}</h3><div id="tblStats">${t('sources.loading')}</div></div>
      <div class="card"><h3>${t('system.partitions')}</h3><div id="sysMeta">${t('sources.loading')}</div></div>
    </div>
    <div class="card"><h3>${t('system.events')}</h3><div class="evlog" id="evlog"></div></div>`;

  const paint = (st) => {
    $('sysKpi').innerHTML = `
      <div class="kpi"><div class="n">${st.postgres_ok ? t('system.ok') : t('system.bad')}</div><div class="l">PostgreSQL</div></div>
      <div class="kpi"><div class="n">${st.redis_ok ? t('system.ok') : t('system.bad')}</div><div class="l">${t('system.redisCache')}</div></div>
      <div class="kpi"><div class="n">${st.embedding_count}</div><div class="l">${t('system.vecChunks')} (${esc(st.vector_backend)})</div></div>
      <div class="kpi"><div class="n" style="font-size:15px">${esc(st.llm_model)}</div><div class="l">${t('system.chatModel')} ${esc(st.broker_backend)}</div></div>`;
    $('tblStats').innerHTML = '<table><tbody>' + st.tables.map(row =>
      `<tr><td class="mono">${esc(row.name)}</td><td style="text-align:right;font-weight:600">${row.count}</td></tr>`).join('') + '</tbody></table>';
    $('sysMeta').innerHTML = `
      <div class="m" style="color:var(--faint);font-size:12.5px;margin-bottom:8px">${t('system.partitionHint')}</div>
      <div class="src-list">${st.partitions.map(p => `<span class="badge info">${esc(p)}</span>`).join('') || t('system.none')}</div>
      <div class="m" style="color:var(--faint);font-size:12.5px;margin:14px 0 6px">${t('system.embeddingModel')}</div>
      <span class="badge info">${esc(st.embedding_model)}</span>`;
    paintEvents(st.recent_events);
  };

  const refresh = async () => {
    try { paint(await api('/api/system/status')); }
    catch (e) {
      // 管理员解锁过期（403）时自动收起入口并退回数据源页
      if (e.status === 403 && S.view === 'system') { S.admin = false; applyAdminUI(); toast(e.message); }
    }
  };
  await refresh();
  clearInterval(statusTimer); statusTimer = setInterval(refresh, 4000);
}

/* 后端事件文案：英文界面优先用 message_en，缺失时回退中文 */
function evText(e){
  if (!e) return '';
  return (S.lang === 'en' ? (e.message_en || e.message) : e.message) || '';
}

function paintEvents(events){
  const box = $('evlog'); if (!box) return;
  S.events = events.slice(-60);
  box.innerHTML = S.events.map(e => `
    <div class="row"><span class="ts">${fmtTime(e.ts)}</span>
    <span class="stg ${esc(e.stage)}">${esc(e.stage)}</span>
    <span>${esc(evText(e))}</span></div>`).join('');
  box.scrollTop = box.scrollHeight;
}

/* ============================================================
 * SSE：实时管道事件（全局，任何视图都可见）
 * ============================================================ */
function connectEvents(){
  const es = new EventSource('/api/system/events');
  es.onmessage = (m) => {
    if (!m.data) return;
    let e; try { e = JSON.parse(m.data); } catch { return; }
    S.events.push(e); if (S.events.length > 200) S.events.shift();
    $('liveStage').textContent = e.stage;
    $('liveTick').textContent = fmtTime(e.ts) + '  ' + evText(e);
    if (S.view === 'system') paintEvents(S.events);
  };
  es.onerror = () => { $('liveStage').textContent = t('live.reconnecting'); };
}

/* ============================================================
 * 启动
 * ============================================================ */
(async function boot(){
  setLang(S.lang);                 // 应用上次选择的语言
  loadMeta().catch(()=>{});
  connectEvents();
  if (S.token) {
    try {
      const u = await api('/api/auth/me');
      enterApp(S.token, u);
    } catch (e) {
      // 401 已在 api() 内清除会话；网络抖动/请求被中断时保留令牌，避免误登出
    }
  }
  // 顶栏展示运行环境（公开健康检查，无需管理员权限）
  try { const st = await api('/api/health');
    S.runtimeBroker = st.broker_backend;
    S.runtimeVector = st.vector_backend;
    updateTopbarChips(); } catch {}
})();
</script>
